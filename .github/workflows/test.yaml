# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: test

on:
  push: {}
  workflow_call: {}
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
          env: false
      - run: mise install task node pnpm
      - run: task install
      - run: task test
      - run: task build

      - name: Test cargo feature combinations
        uses: ./
        with:
          version: "v0.0.39"
          repo: romnn/cargo-feature-combinations
          expected-matching-asset-count: 2
          # prettier-ignore
          assets: |
            - >-
              *cargo-*
              {{~#switch platform ~}}
                {{~#case "win32"~}}windows{{~/case~}}
                {{~#default~}}{{~platform~}}{{~/default~}}
              {{~/switch~}}
              _
              {{~#switch arch ~}}
              {{~#case "x64"~}}amd64{{~/case~}}
              {{~#default~}}{{~arch~}}{{~/default~}}
              {{~/switch~}}
              *

      # - name: Test example
      #   run: |
      #     cd examples/
      #     yarn install --dev
      #     yarn run run || true
      #     file ./tmp/publish-crates-action
