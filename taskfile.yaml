# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
includes:
  lib:
    taskfile: "./tasks/node-lib.yaml"
    vars:
      PACKAGE: "action-get-release"

  action:
    taskfile: "./tasks/node.yaml"
    vars:
      PACKAGE: "action-get-release-action"
tasks:
  install:
    desc: "install dependencies"
    cmds:
      - pnpm install

  check:
    desc: "check workspace"
    cmds:
      - pnpm run check

  build:
    desc: "build workspace"
    cmds:
      - pnpm run build

  lint:
    desc: "lint workspace"
    cmds:
      - pnpm run lint

  lint:fix:
    desc: "lint and fix workspace"
    cmds:
      - pnpm run lint:fix

  test:
    desc: "test workspace"
    cmds:
      - pnpm run test

  format:
    desc: "format"
    cmds:
      - pnpm run format

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  outdated:
    desc: "list outdated deps (incl. new majors): adoptable now vs still in cooldown"
    cmds:
      - "cooldown outdated --sync {{.CLI_ARGS}}"

  outdated:minor:
    desc: "list outdated deps within the current major only"
    cmds:
      - "cooldown outdated --no-major --sync {{.CLI_ARGS}}"

  upgrade:
    desc: "upgrade all deps incl. cross-major bumps, within the cooldown"
    aliases: [update]
    cmds:
      - "cooldown upgrade --major --sync {{.CLI_ARGS}}"

  upgrade:minor:
    desc: "upgrade all deps within their current major, within the cooldown"
    cmds:
      - "cooldown upgrade --no-major --sync {{.CLI_ARGS}}"

  upgrade:latest:
    desc: "upgrade ignoring the cooldown window — use deliberately"
    prompt:
      - "DANGER: this bypasses the supply-chain cooldown and adopts brand-new (possibly compromised) releases. Prefer 'task upgrade' / 'task upgrade:minor'. Continue?"
    cmds:
      - "cooldown upgrade --latest {{.CLI_ARGS}}"

  packlist:
    desc: "check what is included in the NPM package"
    cmds:
      - pnpm dlx npm-packlist
