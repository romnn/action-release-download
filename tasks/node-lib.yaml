# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  check:
    desc: "check {{.PACKAGE}}"
    requires:
      vars: [PACKAGE]
    cmds:
      - pnpm exec turbo run check --filter "{{.PACKAGE}}"

  test:
    desc: "test {{.PACKAGE}}"
    requires:
      vars: [PACKAGE]
    cmds:
      - pnpm exec turbo run test --filter "{{.PACKAGE}}"

  lint:
    desc: "lint {{.PACKAGE}}"
    requires:
      vars: [PACKAGE]
    cmds:
      - pnpm exec turbo run lint --filter "{{.PACKAGE}}"

  build:
    desc: "build {{.PACKAGE}}"
    requires:
      vars: [PACKAGE]
    cmds:
      - pnpm exec turbo run build --filter "{{.PACKAGE}}"

  publish:dry-run:
    desc: "publish {{.PACKAGE}} (dry-run)"
    requires:
      vars: [PACKAGE]
    cmds:
      - pnpm --filter {{.PACKAGE}} publish --dry-run --no-git-checks
